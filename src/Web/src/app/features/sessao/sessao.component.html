<div class="acesso">
  <section class="acesso-painel">
    <img class="acesso-icone" src="/imagens/euconomia-icone.png" alt="" width="58" height="58">
    <h1>Euconomia</h1>
    <p>Acompanhe seu saldo, organize faturas e planeje os próximos meses.</p>
  </section>
  <section class="acesso-form painel">
    <h2>Entre na sua conta</h2>
    @if (erro()) { <p class="mensagem erro" role="alert">{{ erro() }}</p> }
    <form [formGroup]="form" (ngSubmit)="enviar()">
      <label>E-mail <input type="email" formControlName="email" autocomplete="email" required maxlength="240"></label>
      <label>Senha <input type="password" formControlName="senha" autocomplete="current-password" required maxlength="128"></label>
      <button class="primario" [disabled]="form.invalid || ocupado()">Entrar</button>
    </form>
    <div class="flex flex-wrap justify-between gap-3">
      <a class="link" routerLink="/criar-conta">Criar conta</a>
      <a class="link" routerLink="/redefinir-senha">Esqueci minha senha</a>
    </div>
  </section>
</div>
