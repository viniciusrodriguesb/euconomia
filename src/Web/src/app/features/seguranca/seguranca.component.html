<section class="painel mx-auto max-w-lg">
  @if (codigo()) {
    <app-guardar-codigo [codigo]="codigo()" (concluir)="codigo.set('')" />
  } @else {
    <h1 class="!text-2xl">Segurança da conta</h1>
    <p class="mt-2 text-sm text-suave">Gere um código para recuperar sua conta caso esqueça a senha. Esta opção também está disponível para contas já existentes.</p>
    <p class="mt-3 text-sm text-suave">O código anterior será invalidado. Guarde o novo código em um local seguro.</p>
    @if (erro()) { <p class="mensagem erro mt-4" role="alert">{{ erro() }}</p> }
    <form [formGroup]="form" (ngSubmit)="gerar()">
      <label>Senha atual <input type="password" formControlName="senha" autocomplete="current-password" required maxlength="128"></label>
      <button class="primario" [disabled]="form.invalid || ocupado()">Gerar código de recuperação</button>
    </form>
  }
</section>
